# Shared by Proseden server blocks (http context via conf.d).
# rt = browser wait; urt = Node upstream. If rt is large and urt is tiny,
# the delay is nginx/client (often Live SSE), not the world store.
log_format timed '$remote_addr [$time_local] "$request" $status '
                 'rt=$request_time urt=$upstream_response_time';
